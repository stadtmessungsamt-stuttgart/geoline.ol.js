name: Test and Publish

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]
  # Wöchentlicher Lauf (montags) gegen die Dienste von stuttgart.de, damit Serveränderungen auch ohne Commit auffallen
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the development and publishing baseline, 22 the oldest supported LTS
        node: ['24', '22']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm run audit

      - name: Lint (oxlint, TSDoc-Pflicht für öffentliche Exporte)
        run: npm run lint

      - name: Build and pack
        # Built once; every following step and the publish job use exactly this build
        run: npm run pack-dist

      - name: Consumer tests with the packed package (tsc bundler/nodenext, Webpack 5, Vite)
        run: npm run test-consumer

      - name: Run API tests (Cypress)
        # Tests the public API of the built dist without example pages or dev server
        run: npm run test-api
        env:
          CI: true

      - name: Run E2E tests (Cypress)
        # Starts the example server and runs Cypress in Chrome against the built dist
        run: npm run test-e2e
        env:
          CI: true

      - name: Keep the tested package for publishing
        if: matrix.node == '24'
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: .pack/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Download the tested package
        uses: actions/download-artifact@v4
        with:
          name: package
          path: package

      - name: Publish package to npm
        # Publishes the tarball tested in the test job instead of building again
        run: npm publish ./package/*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy_pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Build and deploy to GitHub Pages
        run: npm run deploy-gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
