name: Test and Publish

on:
  push:
    branches:
      - '**'
  pull_request:
  release:
    types: [published]
  # Wöchentlicher Lauf (montags) gegen die Dienste von stuttgart.de, damit Serveränderungen auch ohne Commit auffallen
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: E2E tests (Cypress)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (npm)
        run: npm run audit

      - name: Lint (oxlint, TSDoc-Pflicht für öffentliche Exporte)
        run: npm run lint

      - name: Typecheck TS example as consumer (tsc, without skipLibCheck)
        # Builds dist and checks the shipped .d.ts the way an external TypeScript project uses them
        run: npm run typecheck-examples

      - name: Run Cypress tests
        # This script builds the example app, starts a web server and runs Cypress in Chrome
        run: npm run cypress-run
        env:
          CI: true

      - name: Run API tests (Cypress)
        # Builds dist and tests the public API without example pages or dev server
        run: npm run cypress-api
        env:
          CI: true

  publish:
    name: Publish to npm
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: |
          npm run build-dist

      - name: Publish package to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  deploy_pages:
    name: Deploy GitHub Pages
    if: github.event_name == 'release'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git

      - name: Build and deploy to GitHub Pages
        run: npm run deploy-gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
